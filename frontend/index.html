<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bailanysta — Social platform for IT communities</title>
    <meta name="description" content="Bailanysta — социальная платформа для IT-комьюнити. Лента, клубы, проекты, общение." />
    <script>
      (function() {
        try {
          var th = localStorage.getItem("bailanysta_theme") || "system";
          var m = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = th === "system" ? (m ? "dark" : "light") : th;
          if (resolved === "dark") document.documentElement.classList.add("dark");
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
